<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Radu Cotorceanu - Music Composer | Graphic Designer | Frontend Developer. My personal website portfolio."
    />
    <!--
    Meta tag for image on embeds
    -->
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />

    <meta name="twitter:title" content="raducot.github.io" />
    <meta
      name="twitter:description"
      content="Radu Cotorceanu - Music Composer | Graphic Designer | Frontend Developer. My personal website portfolio."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/logo512.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>raducot.github.io</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      #placeholder {
        background-color: #1c1917;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
      }
      #flowing {
        background: url("%PUBLIC_URL%/dots.svg") repeat 0 0;
        background-size: 1024px;
        animation: flow 20s linear infinite;
        opacity: 0.2;
        width: 100%;
        height: 100%;
        position: absolute;
      }
      @keyframes flow {
        from {
          background-position: 0 0;
        }
        to {
          background-position: 0 1024px;
        }
      }
      /* HTML: <div class="loader"></div> */
      .loader {
        width: 64px;
        aspect-ratio: 5/1;
        background: linear-gradient(
              #0000 calc(1 * 100% / 6),
              #e7e5e4 0 calc(3 * 100% / 6),
              #0000 0
            )
            left bottom,
          linear-gradient(
              #0000 calc(2 * 100% / 6),
              #e7e5e4 0 calc(4 * 100% / 6),
              #0000 0
            )
            center bottom,
          linear-gradient(
              #0000 calc(3 * 100% / 6),
              #e7e5e4 0 calc(5 * 100% / 6),
              #0000 0
            )
            right bottom;
        background-size: 20% 600%;
        background-repeat: no-repeat;
        animation: l3 1s infinite linear;
      }
      @keyframes l3 {
        100% {
          background-position: left top, center top, right top;
        }
      }
    </style>
  </head>
  <!-- Google tag (gtag.js) -->
  <script
    data-goatcounter="https://raducot.goatcounter.com/count"
    async
    src="//gc.zgo.at/count.js"
  ></script>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div id="placeholder">
        <div id="flowing"></div>
        <img
          src="%PUBLIC_URL%/logo512.png"
          alt="Logo"
          width="100"
          height="100"
        />
        <div class="loader"></div>
      </div>
    </div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
